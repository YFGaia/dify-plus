[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "dify-trace-arize-phoenix"
version = "0.0.1"
dependencies = [
    "arize-phoenix-otel==0.15.0",
]
description = "Dify ops tracing provider (Arize / Phoenix)."

[tool.setuptools.packages.find]
where = ["src"]
