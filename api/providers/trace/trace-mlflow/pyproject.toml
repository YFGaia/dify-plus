[build-system]
requires = ["setuptools>=80.10.2,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "dify-trace-mlflow"
version = "0.0.1"
dependencies = [
    "mlflow-skinny>=3.11.1,<4.0.0",
]
description = "Dify ops tracing provider (MLflow / Databricks)."

[tool.setuptools.packages.find]
where = ["src"]
