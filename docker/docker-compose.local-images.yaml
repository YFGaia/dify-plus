# Use already-built current-checkout images without adding build definitions.
# This overlay intentionally does not select historical acceptance image tags.
# From docker/: docker compose -f docker-compose.dify-plus.yaml -f docker-compose.local-images.yaml up -d
# Run initialization and both migration chains first as described in the deployment guide.
services:
  init_secret_key:
    image: dify-plus-api:local
  migration:
    image: dify-plus-api:local
  api:
    image: dify-plus-api:local
  api_websocket:
    image: dify-plus-api:local
  worker:
    image: dify-plus-api:local
  worker-gaia:
    image: dify-plus-api:local
  worker-dataset:
    image: dify-plus-api:local
  worker_beat:
    image: dify-plus-api:local
  web:
    image: dify-plus-web:local
  agent_backend:
    image: dify-plus-agent-backend:local
  local_sandbox:
    image: dify-plus-agent-local-sandbox:local
