# docker-compose override for local build verification
# Usage: docker compose -f docker-compose.dify-plus.yaml -f docker-compose.local-build.yaml --env-file .env.local-test <cmd>
#
# Overrides the pre-built registry images with locally built images from the current source.
# Since 1.16.0 both Dockerfiles use the repository root as build context
# (api/Dockerfile copies api/ + dify-agent/, web/Dockerfile copies the pnpm workspace),
# so `context` points at the repo root and `dockerfile` is the in-repo path.
#
# The images contain the full source; for live source iteration additionally apply
# docker-compose.source-mount.yaml on top of this file.
# Host ports for db/redis are configured via POSTGRES_HOST_PORT/REDIS_HOST_PORT in .env.local-test

services:
  api:
    image: dify-plus-api:casdoor-live-20261003
    build:
      context: ..
      dockerfile: api/Dockerfile

  api_websocket:
    image: dify-plus-api:casdoor-live-20261003

  worker:
    image: dify-plus-api:casdoor-live-20261003

  worker-gaia:
    image: dify-plus-api:casdoor-live-20261003

  worker-dataset:
    image: dify-plus-api:casdoor-live-20261003

  worker_beat:
    image: dify-plus-api:casdoor-live-20261003

  migration:
    image: dify-plus-api:casdoor-live-20261003

  web:
    image: dify-plus-web:casdoor-live-20261003
    build:
      context: ..
      dockerfile: web/Dockerfile
