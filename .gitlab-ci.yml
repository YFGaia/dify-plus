# .gitlab-ci.yml
# 构建并推送 API、Web 镜像到腾讯云容器镜像服务
# 注意（1.15.0 monorepo/uv workspace 适配）：
# - api 镜像构建上下文为仓库根：api/Dockerfile 需要 COPY api/... 与 dify-agent/...
# - web 镜像构建上下文为仓库根：web/Dockerfile 需要根级 pnpm-workspace.yaml、pnpm-lock.yaml 与 packages/*
# - admin 镜像构建已随 p5-admin-decommission 移除

stages:
  - build
  - manifest

variables:
  DOCKER_REGISTRY: ccr.ccs.tencentyun.com
  DIFY_WEB_IMAGE_NAME: ${DOCKER_REGISTRY}/yfgaia/dify-plus-web
  DIFY_API_IMAGE_NAME: ${DOCKER_REGISTRY}/yfgaia/dify-plus-api

# 只有在打tag时触发
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

default:
  before_script:
    - docker login ${DOCKER_REGISTRY} -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD}

# 构建API镜像 - AMD64
build-api-amd64:
  stage: build
  script:
    - |
      platform="linux/amd64"
      image_name=$DIFY_API_IMAGE_NAME
      tag=$CI_COMMIT_TAG
      platform_tag="$tag-amd64"
      docker build \
        --platform $platform \
        --build-arg COMMIT_SHA=$CI_COMMIT_SHA \
        --tag $image_name:$platform_tag \
        --tag $image_name:$CI_COMMIT_SHA-amd64 \
        -f api/Dockerfile .
      docker push $image_name:$platform_tag
      docker push $image_name:$CI_COMMIT_SHA-amd64

# 构建API镜像 - ARM64
build-api-arm64:
  stage: build
  script:
    - |
      platform="linux/arm64"
      image_name=$DIFY_API_IMAGE_NAME
      tag=$CI_COMMIT_TAG
      platform_tag="$tag-arm64"
      docker build \
        --platform $platform \
        --build-arg COMMIT_SHA=$CI_COMMIT_SHA \
        --tag $image_name:$platform_tag \
        --tag $image_name:$CI_COMMIT_SHA-arm64 \
        -f api/Dockerfile .
      docker push $image_name:$platform_tag
      docker push $image_name:$CI_COMMIT_SHA-arm64

# 构建Web镜像 - AMD64
build-web-amd64:
  stage: build
  script:
    - |
      platform="linux/amd64"
      image_name=$DIFY_WEB_IMAGE_NAME
      tag=$CI_COMMIT_TAG
      platform_tag="$tag-amd64"
      docker build \
        --platform $platform \
        --build-arg COMMIT_SHA=$CI_COMMIT_SHA \
        --tag $image_name:$platform_tag \
        --tag $image_name:$CI_COMMIT_SHA-amd64 \
        -f web/Dockerfile .
      docker push $image_name:$platform_tag
      docker push $image_name:$CI_COMMIT_SHA-amd64

# 构建Web镜像 - ARM64
build-web-arm64:
  stage: build
  script:
    - |
      platform="linux/arm64"
      image_name=$DIFY_WEB_IMAGE_NAME
      tag=$CI_COMMIT_TAG
      platform_tag="$tag-arm64"
      docker build \
        --platform $platform \
        --build-arg COMMIT_SHA=$CI_COMMIT_SHA \
        --tag $image_name:$platform_tag \
        --tag $image_name:$CI_COMMIT_SHA-arm64 \
        -f web/Dockerfile .
      docker push $image_name:$platform_tag
      docker push $image_name:$CI_COMMIT_SHA-arm64

# 创建API多架构清单
create-manifest-api:
  stage: manifest
  needs:
    - build-api-amd64
    - build-api-arm64
  script:
    - |
      image_name=$DIFY_API_IMAGE_NAME
      tag=$CI_COMMIT_TAG
      docker manifest create $image_name:$tag $image_name:${tag}-amd64 $image_name:${tag}-arm64
      docker manifest create $image_name:latest $image_name:${tag}-amd64 $image_name:${tag}-arm64
      docker manifest push $image_name:$tag
      docker manifest push $image_name:latest

# 创建Web多架构清单
create-manifest-web:
  stage: manifest
  needs:
    - build-web-amd64
    - build-web-arm64
  script:
    - |
      image_name=$DIFY_WEB_IMAGE_NAME
      tag=$CI_COMMIT_TAG
      docker manifest create $image_name:$tag $image_name:${tag}-amd64 $image_name:${tag}-arm64
      docker manifest create $image_name:latest $image_name:${tag}-amd64 $image_name:${tag}-arm64
      docker manifest push $image_name:$tag
      docker manifest push $image_name:latest
