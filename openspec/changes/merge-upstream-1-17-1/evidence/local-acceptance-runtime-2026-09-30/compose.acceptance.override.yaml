# Local-only overlay for docker/docker-compose.dify-plus.yaml. Never run the base alone.
# No secret values are stored here; private variables are required at runtime.
# Complete candidate images must come from N02/N03 manifests; config validation is not runtime acceptance.
x-acceptance-api-env: &acceptance-api-env
  SECRET_KEY: ${LOCAL_ACCEPTANCE_SECRET_KEY:?Set in a private untracked env file}
  MIGRATION_ENABLED: "false"
  DB_TYPE: postgresql
  DB_HOST: db_postgres
  DB_PORT: "5432"
  DB_USERNAME: postgres
  DB_PASSWORD: ${LOCAL_ACCEPTANCE_DB_PASSWORD:?Set private DB password}
  DB_DATABASE: dify_acceptance
  SQLALCHEMY_ECHO: "false"
  MAIL_TYPE: ""
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_PASSWORD: ${LOCAL_ACCEPTANCE_REDIS_PASSWORD:?Set private Redis password}
  REDIS_USE_SSL: "false"
  REDIS_USE_SENTINEL: "false"
  CELERY_BROKER_URL: redis://:${LOCAL_ACCEPTANCE_REDIS_PASSWORD:?Set private Redis password}@redis:6379/1
  CELERY_USE_SENTINEL: "false"
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: /app/api/storage
  VECTOR_STORE: qdrant
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${LOCAL_ACCEPTANCE_QDRANT_API_KEY:?Set private vector service key}
  QDRANT_GRPC_ENABLED: "false"
  PLUGIN_DAEMON_URL: http://plugin_daemon:5002
  PLUGIN_DAEMON_KEY: ${LOCAL_ACCEPTANCE_PLUGIN_DAEMON_KEY:?Set private plugin service key}
  INNER_API_KEY_FOR_PLUGIN: ${LOCAL_ACCEPTANCE_PLUGIN_INNER_KEY:?Set private plugin callback key}
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  FULL_CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${LOCAL_ACCEPTANCE_SANDBOX_API_KEY:?Set private sandbox service key}
  SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
  SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
  CONSOLE_WEB_URL: http://localhost:23010
  CONSOLE_API_URL: http://localhost:23010
  APP_WEB_URL: http://localhost:23010
  SERVICE_API_URL: http://localhost:23010
  APP_API_URL: http://localhost:23010
  FILES_URL: http://localhost:23010
  INTERNAL_FILES_URL: http://api:5001
  ENABLE_AGENT_V2: "false"
  COOKIE_DOMAIN: ""
  DIFY_AGENT_STUB_URL: ""
  ENABLE_WORKFLOW_COLLABORATION: "true"
  CELERY_AUTO_SCALE: "false"
  CELERY_WORKER_AMOUNT: "1"
  CELERY_WORKER_CONCURRENCY: "1"
  COMPOSE_WORKER_HEALTHCHECK_DISABLED: "true"
x-acceptance-api-deps: &acceptance-api-deps
  init_secret_key:
    condition: service_completed_successfully
  init_permissions:
    condition: service_completed_successfully
  db_postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
services:
  local_sandbox:
    profiles: !override [acceptance-excluded]
  agent_backend:
    profiles: !override [acceptance-excluded]
    environment:
      DIFY_AGENT_INNER_API_KEY: ${LOCAL_ACCEPTANCE_PLUGIN_INNER_KEY:?Set private plugin callback key}
  agent_ssrf_proxy:
    profiles: !override [acceptance-excluded]
  certbot:
    profiles: !override [acceptance-excluded]
  weaviate:
    profiles: !override [acceptance-excluded]
  oceanbase:
    profiles: !override [acceptance-excluded]
  seekdb:
    profiles: !override [acceptance-excluded]
  couchbase-server:
    profiles: !override [acceptance-excluded]
  pgvector:
    profiles: !override [acceptance-excluded]
  vastbase:
    profiles: !override [acceptance-excluded]
  pgvecto-rs:
    profiles: !override [acceptance-excluded]
  chroma:
    profiles: !override [acceptance-excluded]
  iris:
    profiles: !override [acceptance-excluded]
  oracle:
    profiles: !override [acceptance-excluded]
  etcd:
    profiles: !override [acceptance-excluded]
  minio:
    profiles: !override [acceptance-excluded]
  milvus-standalone:
    profiles: !override [acceptance-excluded]
  opensearch:
    profiles: !override [acceptance-excluded]
  opensearch-dashboards:
    profiles: !override [acceptance-excluded]
  opengauss:
    profiles: !override [acceptance-excluded]
  myscale:
    profiles: !override [acceptance-excluded]
  matrixone:
    profiles: !override [acceptance-excluded]
  elasticsearch:
    profiles: !override [acceptance-excluded]
  kibana:
    profiles: !override [acceptance-excluded]
  unstructured:
    profiles: !override [acceptance-excluded]
  sandbox-full:
    profiles: !override [acceptance-excluded]
  init_secret_key:
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: !override []
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    environment:
      <<: *acceptance-api-env
    depends_on: !override
      init_permissions:
        condition: service_completed_successfully
  migration:
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: !override [migration]
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    environment:
      <<: *acceptance-api-env
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: !override []
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    environment:
      <<: *acceptance-api-env
      SERVER_WORKER_CLASS: gevent
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: !override ["[::1]:25442:5001"]
  api_websocket:
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: !override [collaboration]
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    environment:
      <<: *acceptance-api-env
      SERVER_WORKER_AMOUNT: "1"
      SERVER_WORKER_CLASS: geventwebsocket.gunicorn.workers.GeventWebSocketWorker
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: !override ["[::1]:25443:5001"]
  worker:
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: !override []
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    environment:
      <<: *acceptance-api-env
      CELERY_QUEUES: "api_token,dataset,dataset_summary,priority_dataset,priority_pipeline,pipeline,mail,ops_trace,app_deletion,app_rbac,plugin,workflow_storage,conversation,workflow,schedule_poller,schedule_executor,triggered_workflow_dispatcher,trigger_refresh_publisher,trigger_refresh_executor,retention,workflow_based_app_execution"
      CELERY_WORKER_QUEUES: "api_token,dataset,dataset_summary,priority_dataset,priority_pipeline,pipeline,mail,ops_trace,app_deletion,app_rbac,plugin,workflow_storage,conversation,workflow,schedule_poller,schedule_executor,triggered_workflow_dispatcher,trigger_refresh_publisher,trigger_refresh_executor,retention,workflow_based_app_execution"
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker-gaia:
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: !override []
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    environment:
      <<: *acceptance-api-env
      CELERY_QUEUES: extend_high,extend_low
      CELERY_WORKER_QUEUES: extend_high,extend_low
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker-dataset:
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: !override []
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    environment:
      <<: *acceptance-api-env
      CELERY_QUEUES: dataset,priority_dataset
      CELERY_WORKER_QUEUES: dataset,priority_dataset
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker_beat:
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: !override [acceptance-beat]
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    environment:
      <<: *acceptance-api-env
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  init_permissions:
    profiles: !override []
    volumes: !override [acceptance_storage:/app/api/storage]
  web:
    image: ${LOCAL_ACCEPTANCE_WEB_IMAGE:?Set complete verified Web image from manifest}
    profiles: !override []
    networks: !override [default]
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_COOKIE_DOMAIN: ""
      SERVER_CONSOLE_API_URL: http://api:5001
      CONSOLE_API_URL: http://localhost:23010
      APP_API_URL: http://localhost:23010
      NEXT_PUBLIC_SOCKET_URL: ws://localhost:23010
      NEXT_PUBLIC_ENABLE_AGENT_V2: "false"
      ENABLE_AGENT_V2: "false"
    ports: !reset []
  db_postgres:
    image: ${LOCAL_ACCEPTANCE_POSTGRES_IMAGE:-postgres:15.12-alpine}
    profiles: !override []
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_ACCEPTANCE_DB_PASSWORD:?Set private DB password}
      POSTGRES_DB: dify_acceptance
    volumes: !override [acceptance_postgres:/var/lib/postgresql/data]
    ports: !reset []
    healthcheck:
      test: [CMD, pg_isready, -h, db_postgres, -U, postgres, -d, dify_acceptance]
  db_mysql:
    image: ${LOCAL_ACCEPTANCE_MYSQL_IMAGE:-mysql:8.0.46}
    profiles: !override [acceptance-mysql]
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_ACCEPTANCE_DB_PASSWORD:?Set private DB password}
      MYSQL_DATABASE: dify_acceptance_mysql
    volumes: !override [acceptance_mysql:/var/lib/mysql]
    ports: !reset []
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -uroot --silent']
  redis:
    image: ${LOCAL_ACCEPTANCE_REDIS_IMAGE:-redis:6.2-alpine}
    profiles: !override []
    environment:
      REDISCLI_AUTH: ${LOCAL_ACCEPTANCE_REDIS_PASSWORD:?Set private Redis password}
    command: [redis-server, --requirepass, "${LOCAL_ACCEPTANCE_REDIS_PASSWORD:?Set private Redis password}"]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -q PONG']
    volumes: !override [acceptance_redis:/data]
    ports: !reset []
  plugin_daemon:
    image: ${LOCAL_ACCEPTANCE_PLUGIN_IMAGE:?Set supplied plugin daemon0.6.10-local image}
    profiles: !override []
    environment:
      <<: *acceptance-api-env
      DB_TYPE: postgresql
      DB_HOST: db_postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_DATABASE: dify_acceptance_plugin
      SERVER_KEY: ${LOCAL_ACCEPTANCE_PLUGIN_DAEMON_KEY:?Set private plugin service key}
      DIFY_INNER_API_KEY: ${LOCAL_ACCEPTANCE_PLUGIN_INNER_KEY:?Set private plugin callback key}
      DIFY_INNER_API_URL: http://api:5001
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
    depends_on: !override
      db_postgres:
        condition: service_healthy
    volumes: !override [acceptance_plugin:/app/storage]
    ports: !reset []
    networks: !override [default, ssrf_proxy_network]
  ssrf_proxy:
    image: ${LOCAL_ACCEPTANCE_SSRF_IMAGE:?Set supplied Squid image}
    profiles: !override []
    environment:
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ""
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ""
    networks: !override [default, ssrf_proxy_network]
    ports: !reset []
    volumes: !override
      - ./ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro
      - ./ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
  sandbox:
    image: ${LOCAL_ACCEPTANCE_SANDBOX_IMAGE:-langgenius/dify-sandbox:0.2.15}
    profiles: !override []
    environment:
      API_KEY: ${LOCAL_ACCEPTANCE_SANDBOX_API_KEY:?Set private sandbox service key}
    volumes: !override [acceptance_sandbox:/dependencies]
    networks: !override [default, ssrf_proxy_network]
    ports: !reset []
  qdrant:
    image: ${LOCAL_ACCEPTANCE_QDRANT_IMAGE:-langgenius/qdrant:v1.8.3}
    profiles: !override [qdrant]
    environment:
      QDRANT_API_KEY: ${LOCAL_ACCEPTANCE_QDRANT_API_KEY:?Set private vector service key}
    volumes: !override [acceptance_qdrant:/qdrant/storage]
    ports: !reset []
    networks: !override [default]
  nginx:
    entrypoint: !override
      - sh
      - -c
      - >-
        cp /docker-entrypoint-mount.sh /docker-entrypoint.sh &&
        sed -i 's/\r$$//' /docker-entrypoint.sh &&
        chmod +x /docker-entrypoint.sh && sh /docker-entrypoint.sh
    image: ${LOCAL_ACCEPTANCE_NGINX_IMAGE:-nginx:1.27-alpine}
    profiles: !override []
    environment:
      NGINX_SERVER_NAME: _
      NGINX_HTTPS_ENABLED: "false"
      NGINX_PORT: "80"
      NGINX_SOCKET_IO_UPSTREAM: api_websocket:5001
      NGINX_ENABLE_CERTBOT_CHALLENGE: "false"
    depends_on: !override
      api:
        condition: service_started
      web:
        condition: service_started
      api_websocket:
        condition: service_started
    volumes: !override
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/proxy.conf.template:/etc/nginx/proxy.conf.template:ro
      - ./nginx/https.conf.template:/etc/nginx/https.conf.template:ro
      - acceptance_nginx_conf:/etc/nginx/conf.d
      - ./nginx/conf.d/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    ports: !override ["[::1]:23010:80"]
    networks: !override [default]
  migration_mysql:
    extends:
      file: ${LOCAL_ACCEPTANCE_BASE_COMPOSE:?Set absolute fork Compose path}
      service: migration
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: [acceptance-mysql-migration]
    environment:
      <<: *acceptance-api-env
      DB_TYPE: mysql
      DB_HOST: db_mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_DATABASE: dify_acceptance_mysql
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      init_permissions:
        condition: service_completed_successfully
      db_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
  mysql_probe:
    extends:
      file: ${LOCAL_ACCEPTANCE_BASE_COMPOSE:?Set absolute fork Compose path}
      service: api
    image: ${LOCAL_ACCEPTANCE_API_IMAGE:?Set complete candidate API image from manifest}
    profiles: [acceptance-mysql-probe]
    restart: "no"
    environment:
      <<: *acceptance-api-env
      MODE: job
      DB_TYPE: mysql
      DB_HOST: db_mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_DATABASE: dify_acceptance_mysql
    depends_on: !override
      init_secret_key:
        condition: service_completed_successfully
      db_mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: !override [acceptance_storage:/app/api/storage]
    networks: !override [default, ssrf_proxy_network]
    ports: !reset []
volumes:
  acceptance_storage:
  acceptance_postgres:
  acceptance_mysql:
  acceptance_redis:
  acceptance_plugin:
  acceptance_qdrant:
  acceptance_sandbox:
  acceptance_nginx_conf:
networks:
  default:
    driver: bridge
    internal: false
  ssrf_proxy_network:
    driver: bridge
    internal: true
